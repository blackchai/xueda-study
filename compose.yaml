services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      STUDYMATE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-studymate}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-studymate}
      STUDYMATE_FRONTEND_DIST_DIR: /srv/studymate/frontend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studymate}
      POSTGRES_USER: ${POSTGRES_USER:-studymate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - studymate_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studymate} -d ${POSTGRES_DB:-studymate}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  studymate_postgres:
